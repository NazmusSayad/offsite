name: offsite-browser

services:
  devbox:
    build: devbox
    hostname: devbox
    environment:
      OFFSITE_SOURCE: ${OFFSITE_SOURCE:-npm}
    volumes:
      - ./:/opt/devbox/e2e:ro
      - ../..:/opt/offsite-repo:ro

  https:
    image: caddy:2
    volumes:
      - ./https/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - offsite.test

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://devbox:47841

  viewer:
    build: viewer
    ipc: host
    depends_on:
      - devbox
      - https
      - tunnel
    volumes:
      - ./:/opt/viewer/e2e

networks:
  default:
    enable_ipv6: true
